server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=${SYNCUP_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${SYNCUP_MAX_REQUEST_SIZE:50MB}
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
syncup.mail.from=${SYNCUP_MAIL_FROM:${SMTP_USERNAME}}
syncup.auth.two-factor.mode=${SYNCUP_2FA_MODE:email}
cloudflare.api-token=${CLOUDFLARE_API_TOKEN:}
cloudflare.account-id=${CLOUDFLARE_ACCOUNT_ID:}
cloudflare.image-model=${CLOUDFLARE_IMAGE_MODEL:@cf/black-forest-labs/flux-1-schnell}